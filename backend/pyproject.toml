[project]
name = "alpha-research"
version = "0.1.0"
description = "Alpha generation for WorldQuant BRAIN. Simulation is automated; submission is not."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0.25",
    "alembic>=1.13",
    "anthropic>=0.39",
    # BRAIN client (stages 1-2): HTTP + backoff/Retry-After handling.
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.scripts]
alpha-desktop = "app.desktop:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "pyinstaller>=6.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-generated migrations are machine-written; don't lint them.
extend-exclude = ["migrations/versions", "migrations/env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: black handles line length. B008: FastAPI Depends()/Query() defaults are idiomatic.
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
